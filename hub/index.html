<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hub · Linked Objects</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237c5cff' d='M10 13a5 5 0 0 1 0-7l3-3a5 5 0 0 1 7 7l-1.5 1.5M14 11a5 5 0 0 1 0 7l-3 3a5 5 0 0 1-7-7l1.5-1.5'/%3E%3C/svg%3E" />
<style>
:root {
  --bg: #0b0d12;
  --bg-elev: #11141b;
  --bg-elev-2: #161a23;
  --bg-elev-3: #1c2230;
  --line: #232836;
  --line-2: #2c3344;
  --text: #e7ecf4;
  --text-dim: #9aa4b8;
  --text-faint: #5d6680;
  --accent: #7c5cff;
  --accent-2: #00d4ff;
  --accent-soft: rgba(124, 92, 255, .15);
  --good: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --pink: #ff6ec7;
  --shadow: 0 20px 50px -20px rgba(0,0,0,.6), 0 8px 16px -8px rgba(0,0,0,.4);
  --radius: 14px;
  --radius-sm: 8px;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
  --easing: cubic-bezier(.2,.8,.2,1);
}
[data-theme="light"] {
  --bg: #f6f7fb;
  --bg-elev: #ffffff;
  --bg-elev-2: #f0f2f8;
  --bg-elev-3: #e8ecf4;
  --line: #e3e6ef;
  --line-2: #d3d7e2;
  --text: #1a1f2e;
  --text-dim: #5a6275;
  --text-faint: #98a0b3;
  --accent: #6b46e5;
  --accent-2: #0099cc;
  --accent-soft: rgba(107, 70, 229, .1);
  --shadow: 0 10px 30px -12px rgba(20,30,60,.18), 0 4px 8px -4px rgba(20,30,60,.06);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(900px 500px at 0% 0%, rgba(124,92,255,.18), transparent 60%),
    radial-gradient(700px 400px at 100% 100%, rgba(0,212,255,.14), transparent 60%);
  pointer-events: none; z-index: 0;
}
[data-theme="light"] body::before {
  background:
    radial-gradient(900px 500px at 0% 0%, rgba(107,70,229,.07), transparent 60%),
    radial-gradient(700px 400px at 100% 100%, rgba(0,153,204,.05), transparent 60%);
}

/* SHELL */
.shell {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 64px 240px 1fr;
  grid-template-rows: 52px 1fr;
  height: 100vh;
}

/* TOPBAR */
.topbar {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: var(--bg-elev);
  padding: 0 16px 0 0;
  z-index: 10;
}
.brand {
  display: flex; align-items: center; justify-content: center;
}
.brand-mark {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 9px;
  box-shadow: 0 4px 14px rgba(124,92,255,.4);
}
.brand-mark svg { width: 18px; height: 18px; }
.topbar-app-title {
  display: flex; align-items: center; gap: 12px;
  font-weight: 600; letter-spacing: -.01em;
}
.topbar-app-title .crumb { color: var(--text-faint); font-weight: 400; }
.topbar-actions { display: flex; align-items: center; gap: 4px; }

.search-trigger {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 100px;
  cursor: pointer;
  color: var(--text-faint);
  font-family: inherit; font-size: 13px;
  min-width: 280px;
  transition: all .15s var(--easing);
}
.search-trigger:hover { border-color: var(--accent); color: var(--text-dim); }
.search-trigger svg { width: 14px; height: 14px; }
.search-trigger .spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 11px;
  padding: 2px 6px;
  background: var(--bg-elev-3);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text-faint);
}

.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  background: transparent; border: 1px solid transparent;
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s var(--easing);
  position: relative;
}
.icon-btn:hover {
  background: var(--bg-elev-2);
  color: var(--text);
  border-color: var(--line);
}
.icon-btn svg { width: 16px; height: 16px; }
.notif-dot {
  position: absolute;
  top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  border: 2px solid var(--bg-elev);
}
.avatar-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none;
  color: white; font-weight: 600; font-size: 13px;
  cursor: pointer;
  margin-left: 6px;
}

/* APP RAIL */
.rail {
  border-right: 1px solid var(--line);
  background: var(--bg-elev);
  padding: 10px 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  overflow-y: auto;
}
.rail::-webkit-scrollbar { display: none; }
.rail-item {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: transparent; border: none;
  border-radius: 11px;
  color: var(--text-dim);
  cursor: pointer;
  position: relative;
  transition: all .15s var(--easing);
}
.rail-item:hover { background: var(--bg-elev-2); color: var(--text); }
.rail-item.active {
  color: white;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 16px rgba(124,92,255,.4);
}
.rail-item svg { width: 18px; height: 18px; }
.rail-item .badge {
  position: absolute; top: 4px; right: 4px;
  background: var(--accent); color: white;
  font-size: 10px; font-weight: 700;
  padding: 1px 5px; border-radius: 100px;
  border: 2px solid var(--bg-elev);
}
.rail-item.active .badge { background: white; color: var(--accent); border-color: transparent; }
.rail-tip {
  position: absolute; left: calc(100% + 8px); top: 50%;
  transform: translateY(-50%);
  background: var(--bg-elev-3);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .15s var(--easing);
  z-index: 50;
  border: 1px solid var(--line);
}
.rail-item:hover .rail-tip { opacity: 1; }
.rail-divider {
  width: 24px; height: 1px;
  background: var(--line);
  margin: 4px 0;
}

/* SIDEBAR */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg-elev);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-head {
  padding: 16px 18px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.sidebar-head h2 {
  margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
}
.sidebar-body {
  flex: 1; overflow-y: auto;
  padding: 8px 0;
}
.sb-section { padding: 8px 0; }
.sb-section + .sb-section { border-top: 1px solid var(--line); margin-top: 4px; }
.sb-label {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-faint);
  padding: 6px 18px;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px;
  background: transparent; border: none; text-align: left;
  color: var(--text-dim);
  cursor: pointer; font-family: inherit; font-size: 14px;
  position: relative;
  transition: all .12s var(--easing);
  width: 100%;
}
.sb-item:hover { background: var(--bg-elev-2); color: var(--text); }
.sb-item.active {
  background: var(--accent-soft);
  color: var(--text);
  font-weight: 500;
}
.sb-item.active::before {
  content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.sb-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.sb-item .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; border: none; border-radius: 8px;
  font-family: inherit; font-weight: 500; font-size: 13px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(124,92,255,.35);
  transition: transform .12s var(--easing);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-primary svg { width: 12px; height: 12px; }

.compose-btn {
  margin: 14px 18px 4px;
  padding: 9px 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; border: none; border-radius: 9px;
  font-family: inherit; font-weight: 500; font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 14px rgba(124,92,255,.35);
  transition: transform .12s var(--easing);
}
.compose-btn:hover { transform: translateY(-1px); }

/* MAIN */
.main {
  overflow-y: auto;
  position: relative;
  display: flex; flex-direction: column;
}
.main-no-sidebar { grid-column: 2 / -1; }

.content {
  flex: 1; min-height: 0;
  animation: fadeUp .3s var(--easing);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* HOME / DASHBOARD */
.home {
  padding: 28px 32px;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}
.greeting {
  font-size: 32px; font-weight: 700; letter-spacing: -.02em;
  margin: 0 0 4px;
}
.greeting span {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.subgreet { color: var(--text-dim); margin: 0 0 28px; }

.widgets {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
.widget {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.w-6 { grid-column: span 6; }
.w-4 { grid-column: span 4; }
.w-8 { grid-column: span 8; }
.w-12 { grid-column: span 12; }
.widget h3 {
  margin: 0 0 14px;
  font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-faint);
  display: flex; align-items: center; gap: 8px;
}
.widget h3 svg { width: 13px; height: 13px; }
.widget h3 .more {
  margin-left: auto;
  color: var(--accent);
  font-weight: 500; text-transform: none; letter-spacing: 0;
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
}
.widget h3 .more:hover { text-decoration: underline; }

.weather {
  display: flex; align-items: center; gap: 16px;
}
.weather .temp { font-size: 42px; font-weight: 600; letter-spacing: -.03em; }
.weather .info { color: var(--text-dim); }
.weather .info .place { color: var(--text); font-weight: 500; }
.weather .icon {
  font-size: 36px;
  background: linear-gradient(135deg, #ffb84d, #ff6ec7);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.stat-row {
  display: flex; gap: 24px; flex-wrap: wrap;
}
.stat {
  flex: 1; min-width: 100px;
}
.stat .n { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.stat .l { color: var(--text-faint); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }

.activity-feed { display: flex; flex-direction: column; gap: 4px; }
.feed-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0;
}
.feed-item + .feed-item { border-top: 1px solid var(--line); }
.feed-icon {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 9px;
  background: var(--bg-elev-2);
  flex-shrink: 0;
}
.feed-icon svg { width: 14px; height: 14px; }
.feed-content { flex: 1; font-size: 14px; }
.feed-content .who { font-weight: 500; }
.feed-content .lo-link { color: var(--accent-2); cursor: pointer; }
.feed-content .lo-link:hover { text-decoration: underline; }
.feed-time { color: var(--text-faint); font-size: 12px; margin-left: 12px; flex-shrink: 0; }

.agenda-list { display: flex; flex-direction: column; gap: 6px; }
.agenda-item {
  display: flex; gap: 14px; align-items: center;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s var(--easing);
}
.agenda-item:hover { background: var(--bg-elev-2); }
.agenda-time {
  font-family: var(--mono); font-size: 12px;
  color: var(--text-dim);
  width: 60px;
  text-align: right;
}
.agenda-bar {
  width: 3px; align-self: stretch;
  background: var(--accent); border-radius: 2px;
}
.agenda-title { font-weight: 500; }
.agenda-meta { color: var(--text-dim); font-size: 12px; }

.q-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;
}
.q-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 10px;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  text-align: center; font-size: 13px;
  transition: all .15s var(--easing);
}
.q-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}
.q-card .ico {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
}
.q-card .ico svg { width: 18px; height: 18px; }

/* FILES APP */
.files-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
}
.breadcrumb { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; }
.breadcrumb .crumb { color: var(--text-dim); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.breadcrumb .crumb:hover { background: var(--bg-elev-2); color: var(--text); }
.breadcrumb .crumb.cur { color: var(--text); font-weight: 500; }
.breadcrumb .sep { color: var(--text-faint); }
.toolbar-actions { display: flex; gap: 6px; }
.files-grid {
  padding: 20px 24px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.file-card {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 18px 12px;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
  transition: all .15s var(--easing);
  position: relative;
}
.file-card:hover {
  background: var(--bg-elev-2);
  transform: translateY(-2px);
}
.file-card .fi {
  width: 52px; height: 52px;
  display: grid; place-items: center;
  border-radius: 11px;
}
.file-card.dir .fi { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
.file-card.doc .fi { background: rgba(0,212,255,.15); color: var(--accent-2); }
.file-card.img .fi { background: rgba(52,211,153,.15); color: var(--good); }
.file-card.code .fi { background: rgba(251,191,36,.15); color: var(--warn); }
.file-card.audio .fi { background: rgba(255,110,199,.15); color: var(--pink); }
.file-card.other .fi { background: var(--bg-elev-2); color: var(--text-dim); }
.file-card .fi svg { width: 24px; height: 24px; }
.file-card .fn { font-size: 13px; word-break: break-all; line-height: 1.3; }
.file-card .fs { font-size: 11px; color: var(--text-faint); font-family: var(--mono); }

/* MAIL APP */
.mail-layout {
  display: grid;
  grid-template-columns: minmax(320px, 380px) 1fr;
  height: 100%;
  overflow: hidden;
}
.mail-list {
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.mail-list-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.mail-list-head .title { font-weight: 600; }
.mail-list-head .count { color: var(--text-faint); font-size: 12px; font-family: var(--mono); }
.mail-item {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background .12s var(--easing);
}
.mail-item:hover { background: var(--bg-elev-2); }
.mail-item.active { background: var(--accent-soft); }
.mail-item.active::before {
  content: ""; position: absolute; left: 0;
  width: 3px; height: calc(100% - 16px);
  margin-top: -8px;
  background: var(--accent);
}
.mail-item.unread .from { font-weight: 600; }
.mail-item.unread .subject { font-weight: 500; }
.mail-item .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.mail-item .from { flex: 1; font-size: 14px; }
.mail-item .when { font-size: 12px; color: var(--text-faint); }
.mail-item .subject { font-size: 13px; margin-bottom: 4px; }
.mail-item .preview { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-reader {
  overflow-y: auto;
  padding: 28px 32px;
}
.mail-reader h1 { margin: 0 0 16px; font-size: 22px; letter-spacing: -.01em; }
.mail-meta {
  display: flex; gap: 14px; align-items: center;
  padding: 14px 0; margin-bottom: 20px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.mail-meta .avatar-sm {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: white; font-weight: 600; font-size: 13px;
  cursor: pointer;
}
.mail-meta .from-info { flex: 1; }
.mail-meta .from-info .n {
  font-weight: 500; cursor: pointer;
}
.mail-meta .from-info .n:hover { color: var(--accent); }
.mail-meta .from-info .e { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
.mail-meta .when { color: var(--text-faint); font-size: 12px; }
.mail-body { line-height: 1.65; max-width: 70ch; color: var(--text); }
.mail-body p { margin: 0 0 14px; }
.mail-attachments {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.mail-attach {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  transition: all .12s var(--easing);
}
.mail-attach:hover { border-color: var(--accent); }
.mail-attach .fi {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: grid; place-items: center;
  background: rgba(0,212,255,.15); color: var(--accent-2);
}
.mail-attach .fi svg { width: 13px; height: 13px; }

.empty-state {
  display: grid; place-items: center; height: 100%;
  color: var(--text-faint); text-align: center; padding: 40px;
}
.empty-state svg { width: 56px; height: 56px; margin-bottom: 14px; opacity: .4; }

/* CALENDAR */
.cal-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line);
}
.cal-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.cal-nav { display: flex; gap: 4px; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--line);
  gap: 1px;
  flex: 1;
}
.cal-dow {
  background: var(--bg-elev);
  padding: 8px 12px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-faint);
}
.cal-day {
  background: var(--bg-elev);
  padding: 8px;
  min-height: 96px;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  transition: background .12s var(--easing);
}
.cal-day:hover { background: var(--bg-elev-2); }
.cal-day.other { background: var(--bg); color: var(--text-faint); }
.cal-day.today .num {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));

  { id: "n01", title: "On loops, in two senses",
    author: "ada", date: "2026-04-19",
    keywords: ["recursion", "music", "linked-data"],
    text: "Two kinds of loops have been on my mind.\n\n## The first kind\n\nThe loop a program makes when it calls *itself*. A function reaches down its own throat and pulls out the next term. Done badly, this is a stack overflow. Done well, it's a fractal.\n\n## The second kind\n\nThe loop a record makes on a turntable — a closed groove that lets a phrase return changed because you have changed.\n\n## What links them\n\nIn both cases, the **same shape recurs** but the *content* shifts. That's also what a `@context` does in JSON-LD: the keys recur, the values link out.\n\n```\n{ \"@context\": { \"@vocab\": \"https://schema.org/\" } }\n```\n\n> A schema is a courtesy you offer the reader.\n\nI think there's a longer essay here. For now, a paragraph." },
  { id: "n02", title: "Trajectories",
    author: "katherine", date: "2026-04-15",
    keywords: ["physics", "computing"],
    text: "A trajectory is a calculation that *insists*. You write it down, you check it twice, and then you stand by it.\n\n## What I keep telling students\n\nThe arithmetic is not the hard part. The hard part is the *bookkeeping*: knowing which number is which, and not letting the units quietly go missing in the third column.\n\n## Notation as discipline\n\nA good notation prevents a mistake before it happens. It refuses to let you write a thing that is meaningless." },
  { id: "n03", title: "Goto, a recantation (joking)",
    author: "edsger", date: "2026-04-10",
    keywords: ["computing", "style"],
    text: "I will not in fact recant.\n\nThe usual objection — that *some* loops are clearer with a goto — assumes the loops are already there. The discipline is to *write the program differently from the start*, not to patch a poor structure with a backwards leap.\n\n```\nfor (i = 0; i < n; ++i)\n  if (a[i] == x) goto found;  /* no */\n```\n\nA program is read more often than it is written. That is the entire argument." },
  { id: "n04", title: "What a compiler is, in one paragraph",
    author: "grace", date: "2026-04-08",
    keywords: ["computing"],
    text: "A compiler is a translator that does not get tired. You teach it a vocabulary and a grammar, and from then on it will translate the same sentence the same way every time, even at three in the morning. The miracle is not that this is *fast*. The miracle is that it is *patient*." },
  { id: "n05", title: "On notation",
    author: "ada", date: "2026-04-05",
    keywords: ["maths", "writing"],
    text: "A notation is a kind of architecture for thought. Bad notation forces you to carry the same idea up and down the stairs all day. Good notation puts it on the floor where it lives.\n\nSee also Mary's [proof](#) on the orbit calculations — same trick." },

/* ================================================================
 *  HELPERS
 * ================================================================ */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function escape(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name) { return name.split(" ").map(s => s[0]).join("").slice(0, 2); }
function person(id) { return PEOPLE.find(p => p.id === id); }
function file(id) { return FILES.find(f => f.id === id); }
function fmtBytes(b) {
  if (b == null) return "";
  if (b < 1024) return b + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
  return (b / (1024 * 1024)).toFixed(2) + " MB";
}
function fmtDur(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function relTime(dateStr) {
  const now = new Date("2026-04-25T12:00:00");
  const d = new Date(dateStr);
  const diff = (now - d) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  const days = Math.floor(diff / 86400);
  if (days < 7) return days + "d ago";
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
function fmtTime(t) { return t; }
function md(text) {
  let h = escape(text);
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`);
  h = h.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  h = h.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  h = h.replace(/^- (.+)$/gm, "<li>$1</li>");
  h = h.replace(/(<li>.*<\/li>\n?)+/g, m => "<ul>" + m + "</ul>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  h = h.split(/\n{2,}/).map(p => {
    if (/^<(h2|h3|pre|ul|blockquote)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, "<br>")}</p>`;
  }).join("");
  return h;
}

/* ================================================================
 *  TOPBAR + RAIL
 * ================================================================ */
function buildRail() {
  const rail = $("#rail");
  rail.innerHTML = APPS.slice(0, 9).map((a, i) => railItem(a, i + 1)).join("")
    + '<div class="rail-divider"></div>'
    + APPS.slice(9).map((a) => railItem(a)).join("");
  rail.querySelectorAll(".rail-item").forEach(el => {
    el.addEventListener("click", () => switchApp(el.dataset.app));
  });
}
function railItem(a, kbd) {
  const unread = a.id === "mail" ? MESSAGES.filter(m => m.unread).length : 0;
  return `
    <button class="rail-item ${state.app === a.id ? "active" : ""}" data-app="${a.id}" title="${a.name}">
      ${a.icon}
      ${unread ? `<span class="badge">${unread}</span>` : ""}
      <span class="rail-tip">${a.name}${kbd ? ` <span class="kbd">${kbd}</span>` : ""}</span>
    </button>
  `;
}
function setRailActive() {
  $$(".rail-item").forEach(el => el.classList.toggle("active", el.dataset.app === state.app));
}

function setTopbarTitle(html) { $("#topbar-title").innerHTML = html; }

/* ================================================================
 *  APP SWITCHER
 * ================================================================ */
function switchApp(id) {
  if (!APPS.find(a => a.id === id)) return;
  state.app = id;
  setRailActive();
  const app = APPS.find(a => a.id === id);
  const main = $("#main");
  const sidebar = $("#sidebar");
  if (app.hasSidebar) {
    sidebar.style.display = "flex";
    main.classList.remove("main-no-sidebar");
  } else {
    sidebar.style.display = "none";
    main.classList.add("main-no-sidebar");
  }
  RENDERERS[id]();
  history.replaceState(null, "", "#" + id);
}

/* ================================================================
 *  RENDER HELPERS
 * ================================================================ */
function sbFolder(f, depth) {
  const isCur = state.files.folder === f.id;
  const children = FOLDERS.filter(x => x.parent === f.id);
  return `
    <button class="sb-item ${isCur ? "active" : ""}" data-folder="${f.id}" style="padding-left:${18 + depth * 14}px">
      ${ICON.files} ${escape(f.name === "/" ? "Home" : f.name)}
    </button>
    ${children.map(c => sbFolder(c, depth + 1)).join("")}
  `;
}
function folderPath(f) {
  const out = [f];
  let cur = f;
  while (cur.parent) {
    cur = FOLDERS.find(x => x.id === cur.parent);
    if (cur) out.unshift(cur);
  }
  return out;
}
function fileCard(it) {
  if (it.kind === "dir") {
    return `<div class="file-card dir" data-open-folder="${it.id}">
      <div class="fi">${ICON.files}</div>
      <div class="fn">${escape(it.name)}</div>
      <div class="fs">folder</div>
    </div>`;
  }
  const cls = fileClass(it.format);
  return `<div class="file-card ${cls}" data-open-file="${it.id}">
    <div class="fi">${fileIcon(it.format)}</div>
    <div class="fn">${escape(it.name)}</div>
    <div class="fs">${fmtBytes(it.size)}</div>
  </div>`;
}
function fileClass(format) {
  if (!format) return "other";
  if (format.startsWith("image/")) return "img";
  if (format.startsWith("audio/")) return "audio";
  if (format === "text/javascript" || format === "text/css" || format.includes("json")) return "code";
  if (format === "text/markdown" || format === "text/plain") return "doc";
  return "other";
}
function fileIcon(format) {
  if (format && format.startsWith("image/")) return ICON.img;
  if (format && format.startsWith("audio/")) return ICON.audio;
  if (format === "text/javascript" || format === "text/css" || (format && format.includes("json"))) return ICON.code;
  return ICON.doc;
}

function renderMail(m) {
  const from = person(m.from);
  const to = m.to.map(t => person(t).name).join(", ");
  return `
    <h1>${escape(m.subject)}</h1>
    <div class="mail-meta">
      <div class="avatar-sm av-c${from.color}" data-link-person="${from.id}">${initials(from.name)}</div>
      <div class="from-info">
        <div class="n" data-link-person="${from.id}">${escape(from.name)}</div>
        <div class="e">${escape(from.email)} → ${escape(to)}</div>
      </div>
      <div class="when">${new Date(m.date).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</div>
    </div>
    <div class="mail-body">${m.body.split("\n\n").map(p => `<p>${md(p).replace(/^<p>|<\/p>$/g, "")}</p>`).join("")}</div>
    ${m.attachments.length ? `

        }).join("")}
      </div>
    ` : ""}
  `;
}

function calendarDays(y, m) {
  // produce 42 cells covering this month (Mon-start)
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7; // Mon=0
  const start = new Date(y, m, 1 - offset);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }
  return days;
}
function calDay(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const iso = `${yyyy}-${mm}-${dd}`;
  const today = "2026-04-25";
  const inMonth = d.getMonth() === state.calendar.month;
  const events = EVENTS.filter(e => e.date === iso);
  return `<div class="cal-day ${inMonth ? "" : "other"} ${iso === today ? "today" : ""}">
    <div class="num">${d.getDate()}</div>
    ${events.map(e => `<div class="cal-event ${e.color === 1 ? "alt" : e.color === 2 ? "alt2" : ""}" data-event="${e.id}">${escape(e.title)}</div>`).join("")}
  </div>`;
}

/* Wire common cross-app .lo-link[data-link-*] anchors inside a root */
function wireCrossLinks(root) {
  root.querySelectorAll(".lo-link[data-link-person]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation();
    state.contacts.selected = el.dataset.linkPerson;
    switchApp("contacts");
  }));
  root.querySelectorAll(".lo-link[data-link-msg]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation();
    state.mail.selected = el.dataset.linkMsg;
    switchApp("mail");
  }));
  root.querySelectorAll(".lo-link[data-link-file]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const f = file(el.dataset.linkFile);
    if (f) state.files.folder = f.parent;
    switchApp("files");
  }));
  root.querySelectorAll(".lo-link[data-link-note]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation();
    state.notes.selected = el.dataset.linkNote;
    switchApp("notes");
  }));
  root.querySelectorAll(".lo-link[data-link-event]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation();
    switchApp("calendar");
  }));
}

/* ================================================================
 *  ACTIVITY FEED — generated from all entities
 * ================================================================ */
function activityFeed() {
  const items = [];
  MESSAGES.forEach(m => {
    items.push({
      ts: m.date,
      icon: ICON.mail,
      html: `<span class="lo-link" data-link-person="${m.from}">${escape(person(m.from).name)}</span> sent <span class="lo-link" data-link-msg="${m.id}">"${escape(m.subject)}"</span>`,
      day: dayLabel(m.date),
      timeText: relTime(m.date)
    });
  });
  NOTES.forEach(n => {
    items.push({
      ts: n.date + "T15:00",
      icon: ICON.notes,
      html: `<span class="lo-link" data-link-person="${n.author}">${escape(person(n.author).name)}</span> wrote <span class="lo-link" data-link-note="${n.id}">"${escape(n.title)}"</span>`,
      day: dayLabel(n.date),
      timeText: relTime(n.date)
    });
  });
  FILES.forEach(f => {
    items.push({
      ts: f.date + "T12:00",
      icon: fileIcon(f.format),
      html: `<span class="lo-link" data-link-person="${f.owner}">${escape(person(f.owner).name)}</span> uploaded <span class="lo-link" data-link-file="${f.id}">${escape(f.name)}</span>`,
      day: dayLabel(f.date),
      timeText: relTime(f.date)
    });
  });
  EVENTS.forEach(e => {
    items.push({
      ts: e.date + "T08:00",
      icon: ICON.calendar,
      html: `Event scheduled: <span class="lo-link" data-link-event="${e.id}">${escape(e.title)}</span> with ${e.attendees.map(a => `<span class="lo-link" data-link-person="${a}">${escape(person(a).name.split(" ")[0])}</span>`).join(", ")}`,
      day: dayLabel(e.date),
      timeText: relTime(e.date)
    });
  });
  return items.sort((a, b) => b.ts.localeCompare(a.ts));
}
function dayLabel(d) {
  const date = new Date(d);
  const today = new Date("2026-04-25");
  const diff = Math.floor((today - date) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 7) return `${diff} days ago`;
  return date.toLocaleDateString("en-GB", { day: "numeric", month: "long" });
}

/* ================================================================
 *  SPOTLIGHT SEARCH
 * ================================================================ */
function openSpotlight() {
  $("#spot-bg").classList.add("on");
  setTimeout(() => $("#spot-input").focus(), 30);
  spotSearch("");
}
function closeSpotlight() {
  $("#spot-bg").classList.remove("on");
  $("#spot-input").value = "";
}
function spotSearch(q) {
  const ql = q.toLowerCase().trim();
  const results = {
    people:   PEOPLE.filter(p => !ql || p.name.toLowerCase().includes(ql) || p.role.toLowerCase().includes(ql) || p.bio.toLowerCase().includes(ql)),
    messages: MESSAGES.filter(m => !ql || m.subject.toLowerCase().includes(ql) || m.body.toLowerCase().includes(ql)),
    files:    FILES.filter(f => !ql || f.name.toLowerCase().includes(ql)),
    notes:    NOTES.filter(n => !ql || n.title.toLowerCase().includes(ql) || n.text.toLowerCase().includes(ql)),
    events:   EVENTS.filter(e => !ql || e.title.toLowerCase().includes(ql) || e.location.toLowerCase().includes(ql)),
    apps:     APPS.filter(a => !ql || a.name.toLowerCase().includes(ql))
  };
  const total = Object.values(results).reduce((s, a) => s + a.length, 0);
  const root = $("#spot-results");
  if (!total) {
    root.innerHTML = `<div class="spot-empty">No results for "${escape(q)}"</div>`;
    return;
  }
  let h = "";
  const limit = ql ? 5 : 3;
  if (results.apps.length) h += spotGroup("Apps", results.apps.slice(0, limit), a => ({
    icon: a.icon, t: a.name, s: "Open " + a.name.toLowerCase(), type: "app", action: () => switchApp(a.id)
  }));
  if (results.people.length) h += spotGroup("People", results.people.slice(0, limit), p => ({
    icon: `<div style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:600;font-size:10px" class="av-c${p.color}">${initials(p.name)}</div>`,
    t: p.name, s: p.role, type: "Person", action: () => { state.contacts.selected = p.id; switchApp("contacts"); closeSpotlight(); }
  }));
  if (results.messages.length) h += spotGroup("Messages", results.messages.slice(0, limit), m => ({
    icon: ICON.mail, t: m.subject, s: "from " + person(m.from).name, type: "Message", action: () => { state.mail.selected = m.id; switchApp("mail"); closeSpotlight(); }
  }));
  if (results.notes.length) h += spotGroup("Notes", results.notes.slice(0, limit), n => ({
    icon: ICON.notes, t: n.title, s: "by " + person(n.author).name, type: "Note", action: () => { state.notes.selected = n.id; switchApp("notes"); closeSpotlight(); }
  }));
  if (results.files.length) h += spotGroup("Files", results.files.slice(0, limit), f => ({
    icon: fileIcon(f.format), t: f.name, s: fmtBytes(f.size), type: "File", action: () => { state.files.folder = f.parent; switchApp("files"); closeSpotlight(); }
  }));
  if (results.events.length) h += spotGroup("Events", results.events.slice(0, limit), e => ({
    icon: ICON.calendar, t: e.title, s: e.date + " · " + e.location, type: "Event", action: () => { switchApp("calendar"); closeSpotlight(); }
  }));
  root.innerHTML = h;
  // attach handlers
  root.querySelectorAll(".spot-r").forEach((el, i) => {
    el.addEventListener("click", () => { spotActions[i](); closeSpotlight(); });
  });
  // first selected
  const first = root.querySelector(".spot-r"); if (first) first.classList.add("sel");
}
const spotActions = [];
function spotGroup(label, list, fn) {
  if (!list.length) return "";
  let h = `<div class="spot-group"><div class="h">${label}</div>`;
  list.forEach(item => {
    const o = fn(item);
    spotActions.push(o.action);
    h += `<div class="spot-r"><div class="ico">${o.icon}</div><div class="meta"><div class="t">${escape(o.t)}</div><div class="s">${escape(o.s)}</div></div><div class="type">${o.type}</div></div>`;
  });
  h += "</div>";
  return h;
}

/* ================================================================
 *  THEME + KEYBOARD + INIT
 * ================================================================ */
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("hub-theme", next);
  updateThemeIcon(next);
  if (state.app === "settings") RENDERERS.settings();
}
function updateThemeIcon(t) {
  $("#theme-icon").innerHTML = t === "light"
    ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}

function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("on"), 2000);
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") { closeSpotlight(); }
    return;
  }
  const inSpot = $("#spot-bg").classList.contains("on");
  if (e.key === "Escape") {
    closeSpotlight();
    closeLightbox();
    $("#notif-pop").classList.remove("on");
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (inSpot) closeSpotlight(); else openSpotlight();
    return;
  }
  if (inSpot) {
    if (e.key === "Enter") {
      const sel = $("#spot-results .sel") || $("#spot-results .spot-r");
      if (sel) sel.click();
      e.preventDefault();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const all = [...$$("#spot-results .spot-r")];
      const idx = all.findIndex(el => el.classList.contains("sel"));
      const next = e.key === "ArrowDown" ? Math.min(all.length - 1, idx + 1) : Math.max(0, idx - 1);
      all.forEach(el => el.classList.remove("sel"));
      if (all[next]) { all[next].classList.add("sel"); all[next].scrollIntoView({ block: "nearest" }); }
      e.preventDefault();
    }
    return;
  }
  if (e.key >= "1" && e.key <= "9") {
    const a = APPS[+e.key - 1]; if (a) switchApp(a.id);
  } else if (e.key === "0") {
    switchApp("activity");
  } else if (e.key.toLowerCase() === "t") {
    toggleTheme();
  } else if (e.key === "/" || e.key === "?") {
    openSpotlight(); e.preventDefault();
  }
});

$("#search-trigger").addEventListener("click", openSpotlight);
$("#spot-bg").addEventListener("click", closeSpotlight);
$("#spot-input").addEventListener("input", (e) => spotSearch(e.target.value));
$("#theme-btn").addEventListener("click", toggleTheme);
$("#lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
$("#lb-close").addEventListener("click", closeLightbox);
$("#notif-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  $("#notif-pop").classList.toggle("on");
});
document.addEventListener("click", (e) => {
  if (!$("#notif-pop").contains(e.target) && e.target.id !== "notif-btn") {
    $("#notif-pop").classList.remove("on");
  }
});

/* ----- INIT ----- */
const savedTheme = localStorage.getItem("hub-theme");
if (savedTheme) {
  document.documentElement.setAttribute("data-theme", savedTheme);
  updateThemeIcon(savedTheme);
}
buildRail();
buildNotifications();
const hash = location.hash.replace("#", "");
switchApp(APPS.find(a => a.id === hash) ? hash : "home");

// First-visit nudge
setTimeout(() => {
  if (!localStorage.getItem("hub-seen")) {
    showToast("Tip — press ⌘K to search across everything");
    localStorage.setItem("hub-seen", "1");
  }
}, 900);
